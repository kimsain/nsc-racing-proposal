<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>NESCL R · 레이싱 라인 (콘셉트 목업)</title>
<meta name="description" content="원단 수치를 공개하는 레이싱 라인 NESCL R의 판매 페이지를 상상해 본 비공식 콘셉트 목업입니다. 제품, 수치, 가격은 예시입니다.">
<meta property="og:title" content="NESCL R · 레이싱 라인 (콘셉트 목업)">
<meta property="og:description" content="비공식 콘셉트 목업입니다. 제품, 수치, 가격은 예시이며 판매하지 않습니다.">
<meta property="og:image" content="assets/img/og-cover.jpg">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="collection">
<p class="notice" id="notice"></p>
<header class="hdr" id="hdr"></header>

<main class="wrap">
  <div class="c-head">
    <h1>NESCL R</h1>
    <p id="intro"></p>
  </div>

  <section class="c-tools" aria-label="필터와 정렬">
    <div class="tabs" role="tablist" aria-label="카테고리" id="catTabs"></div>
    <div class="temp-filter">
      <label for="tempRange">오늘 기온 <output id="tempOut" for="tempRange"></output></label>
      <input type="range" id="tempRange" step="1">
      <button type="button" class="link" id="tempClear" data-temp-clear>기온 지우기</button>
    </div>
    <div class="sort">
      <p id="count" aria-live="polite"></p>
      <label class="visually-hidden" for="sort">정렬</label>
      <select id="sort"></select>
    </div>
  </section>

  <ul class="grid" id="grid"></ul>

  <figure class="c-band">
    <img src="assets/img/collection-specimens.webp" alt="네 제품의 원단 시험편을 나란히 놓은 사진" width="1200" height="800" loading="lazy" data-optional>
    <figcaption id="bandCap"></figcaption>
  </figure>

  <section class="c-compare" aria-labelledby="cmpTitle">
    <div class="sec-h"><h2 id="cmpTitle">R 제품 비교</h2><p>행 이름을 누르면 그 스펙의 측정 방법과 기준이 열립니다.</p></div>
    <div class="cmp-wrap"><table class="cmp" id="cmpTable"></table></div>
  </section>
</main>

<footer class="foot" id="foot"></footer>

<dialog class="drawer" id="specDrawer" aria-labelledby="specTitle"><div class="drawer-in" id="specBody"></div></dialog>
<dialog class="drawer" id="cartDrawer" aria-labelledby="cartTitle"><div class="drawer-in" id="cartBody"></div></dialog>

<script src="data.js"></script>
<script src="logic.js"></script>
<script src="anim.js"></script>
<script src="anim/gsm.js"></script>
<script src="anim/weight.js"></script>
<script src="anim/cfm.js"></script>
<script src="anim/mvtr.js"></script>
<script src="anim/ret.js"></script>
<script src="anim/clo.js"></script>
<script src="anim/dry.js"></script>
<script src="anim/stretch.js"></script>
<script src="anim/temp.js"></script>
<script src="anim/compression.js"></script>
<script src="anim/repel.js"></script>
<script src="app.js"></script>
</body>
</html>
